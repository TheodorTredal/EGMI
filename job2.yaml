kind: Job
apiVersion: batch/v1
metadata:
  name: ttr042-rosie-testing2 #Custom name for your job
spec:
  template:
    spec:
      containers:
      - name: rosie-container
        image: "ttr042/rosie-test:latest"  # Replace with your Docker image
        workingDir: /storage
        command: ["sh", "experiment.sh"]  # Adjust if your script name is different
        volumeMounts:
        - name: storage
          mountPath: /storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: storage
      restartPolicy: OnFailure
  backoffLimit: 0
